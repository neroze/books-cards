<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office English Swipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1c1b22;--mut:#6b6877;--acc:#ff4d6d;--ok:#12b886;--line:#e8e4dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--card:#22212b;--ink:#f2f0f7;--mut:#9d9aab;--line:#33313f}}
:root[data-theme="dark"]{--bg:#15141a;--card:#22212b;--ink:#f2f0f7;--mut:#9d9aab;--line:#33313f}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.card{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s ease,opacity .3s ease}
.card.drag{transition:none}
</style>
</head>
<body>
<div class="h-full flex flex-col items-center px-4 py-4 max-w-md mx-auto">
  <header class="w-full flex items-center justify-between">
    <h1 class="text-lg font-extrabold tracking-tight"><span style="color:var(--acc)">Office</span>English</h1>
    <div class="text-sm font-semibold" style="color:var(--mut)"><span id="pos">1</span>/<span id="tot"></span> · <span id="ok" style="color:var(--ok)">0</span> known</div>
  </header>

  <main id="stack" class="relative w-full flex-1 my-4"></main>

  <div class="flex items-center gap-6 pb-2">
    <button id="no" aria-label="Review again" class="w-16 h-16 rounded-full text-3xl shadow-lg active:scale-90 transition" style="background:var(--card);color:var(--acc)">✕</button>
    <button id="yes" aria-label="Got it" class="w-16 h-16 rounded-full text-3xl shadow-lg active:scale-90 transition" style="background:var(--card);color:var(--ok)">✓</button>
  </div>
  <p class="text-xs pb-1" style="color:var(--mut)">Swipe right = got it · left = review again</p>
</div>

["My key takeaway is to involve QA earlier.","One takeaway from the retro was clearer ownership.","I'll share the takeaways with the wider team."],
["Let's align with finance before sending the proposal.","Our goals must align with the company strategy.","Are we aligned on who owns the release?"],
["I need to clarify the scope before we estimate.","Let me clarify: this is a proposal, not a decision.","Can we clarify who approves the change?"],
["I'll reiterate the main risks in the summary.","Allow me to reiterate our commitment to the deadline.","He reiterated that the budget is fixed."]
];
D.forEach((d,k)=>X[k]&&d.push(...X[k]));
const stack=document.getElementById('stack');
let i=0,known=0,busy=false;
try{const sv=JSON.parse(localStorage.getItem('oe-state')||'null');if(sv){i=Math.min(Math.max(sv.i|0,0),D.length);known=sv.k|0}}catch(e){}
function save(){try{localStorage.setItem('oe-state',JSON.stringify({i,k:known}))}catch(e){}}
document.getElementById('tot').textContent=D.length;

function html(d,n){return `<div class="text-xs font-bold uppercase tracking-widest" style="color:var(--acc)">Word ${n}</div>
<h2 class="text-4xl font-extrabold mt-2 leading-tight">${d[0]}</h2>
<p class="mt-1 text-lg italic" style="color:var(--mut)">${d[1]}</p>
<div class="mt-5 space-y-2">${d.slice(2).map(t=>`<p class="p-3 rounded-xl text-sm leading-snug" style="background:var(--bg)">“${t}”</p>`).join('')}</div>
<span class="tag-ok absolute top-6 left-5 px-3 py-1 rounded-lg border-4 font-extrabold text-xl -rotate-12 opacity-0" style="color:var(--ok);border-color:var(--ok)">GOT IT</span>
<span class="tag-no absolute top-6 right-5 px-3 py-1 rounded-lg border-4 font-extrabold text-xl rotate-12 opacity-0" style="color:var(--acc);border-color:var(--acc)">REVIEW</span>`}

function mk(d,n,top){
  const c=document.createElement('div');
  c.className='card absolute inset-0 rounded-3xl p-6 pt-14 shadow-2xl overflow-y-auto';
  c.style.cssText=`background:var(--card);border:1px solid var(--line);transform:scale(${top?1:.94}) translateY(${top?0:14}px);z-index:${top?2:1}`;
  c.innerHTML=html(d,n);return c;
}

function render(){
  stack.innerHTML='';
  document.getElementById('pos').textContent=Math.min(i+1,D.length);
  document.getElementById('ok').textContent=known;save();
  if(i>=D.length){
    stack.innerHTML=`<div class="h-full flex flex-col items-center justify-center text-center rounded-3xl p-6" style="background:var(--card);border:1px solid var(--line)">
    <div class="text-6xl">🎉</div><h2 class="text-2xl font-extrabold mt-3">Deck complete</h2>
    <p class="mt-2" style="color:var(--mut)">You knew ${known} of ${D.length} words.</p>
    <button id="again" class="mt-6 px-6 py-3 rounded-full font-bold text-white" style="background:var(--acc)">Start again</button></div>`;
    document.getElementById('again').onclick=()=>{i=0;known=0;render()};return;
  }
  if(i+1<D.length)stack.appendChild(mk(D[i+1],i+2,false));
  const c=mk(D[i],i+1,true);stack.appendChild(c);attach(c);
}

function attach(c){
  let sx=0,dx=0,on=false;
  const ok=c.querySelector('.tag-ok'),no=c.querySelector('.tag-no');
  c.addEventListener('pointerdown',e=>{if(busy)return;on=true;sx=e.clientX;c.classList.add('drag');c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;
    c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    ok.style.opacity=Math.max(0,dx/100);no.style.opacity=Math.max(0,-dx/100)});
  const end=()=>{if(!on)return;on=false;c.classList.remove('drag');
    if(Math.abs(dx)>100)fly(dx>0);else{c.style.transform='';ok.style.opacity=no.style.opacity=0}dx=0};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

function fly(right){
  const c=stack.lastElementChild;if(busy||!c.classList.contains('card'))return;busy=true;
  c.style.transform=`translateX(${right?600:-600}px) rotate(${right?30:-30}deg)`;c.style.opacity=0;
  if(right)known++;
  setTimeout(()=>{i++;busy=false;render()},280);
}
document.getElementById('yes').onclick=()=>fly(true);
document.getElementById('no').onclick=()=>fly(false);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')fly(true);if(e.key==='ArrowLeft')fly(false)});
render();
</script>
</body>
</html>

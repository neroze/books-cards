<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>48 Laws of Power</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14100f; --ink:#f6efe4; --muted:#a79b8c; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  .serif { font-family:Fraunces,Georgia,serif; }
  .card { touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
  .card:active { cursor:grabbing; }
  button:focus-visible { outline:2px solid #e8c36a; outline-offset:3px; }
</style>
</head>
<body>
<main class="h-full max-w-md mx-auto flex flex-col px-4 py-3">
  <header class="flex items-baseline justify-between mb-3">
    <h1 class="serif text-xl font-extrabold">48 Laws of Power</h1>
    <span id="count" class="text-sm" style="color:var(--muted)"></span>
  </header>

  <div id="stack" class="relative flex-1 min-h-0"></div>

  <nav class="flex items-center justify-center gap-6 pt-4 pb-2" aria-label="Card controls">
    <button id="pass" aria-label="Swipe left, next card" class="w-16 h-16 rounded-full border-2 border-rose-400 text-rose-400 text-3xl active:scale-90 transition"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button id="back" aria-label="Previous card" class="w-11 h-11 rounded-full border-2 border-amber-300 text-amber-300 text-xl active:scale-90 transition">↺</button>
    <button id="keep" aria-label="Swipe right, next card" class="w-16 h-16 rounded-full border-2 border-emerald-400 text-emerald-400 text-3xl active:scale-90 transition"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </nav>
  <p class="text-center text-xs pb-1" style="color:var(--muted)">Tap card to flip. Swipe left or right for the next law.</p><p class="text-center pb-1" style="color:var(--muted);font-size:10px">Photos: Unsplash — Randy Fath, Ben Willimann, Piotr Makowski, Yagnik Sankhedawala, Edoardo Bortoli, Srinivas Bandari, Rafael Rex Felisilda, Sasun Bughdaryan, Arturo Añez, Felix Mittermeier, Fatima Shahid, Buddika Gunathilaka</p>
</main>

<script>
const L = [
["Never outshine the master","Make your superiors feel brilliant. Shine too brightly and insecure bosses will cut you down."],
["Be wary of friends, use enemies","Friends envy and betray; former enemies work harder to prove loyalty."],
["Conceal your intentions","Keep people guessing. If they can't see your goal, they can't block it."],
["Say less than necessary","The more you talk, the more ordinary you sound and the more you give away."],
["Guard your reputation","Reputation is currency. Build it carefully and attack your rivals' to weaken them."],
["Court attention","Be visible and memorable. Being ignored is worse than being criticized."],
["Get others to do the work, take the credit","Use others' skill and effort, then present the result as yours."],
["Make people come to you","Control the terms by making them move. Stay calm while they act."],
["Win through actions, not arguments","Demonstrate instead of debating. Arguments win nothing; results persuade."],
["Avoid the unhappy and unlucky","Misery is contagious. Choose company that lifts you."],
["Keep people dependent on you","Make yourself indispensable and you can't be discarded."],
["Use selective honesty and generosity to disarm","One sincere gesture can lower a target's guard for a long time."],
["Appeal to self-interest, not mercy","When asking for help, show what they gain. Never lean on gratitude."],
["Act friendly, gather intelligence","Ask casual questions and listen. Information is leverage."],
["Crush your enemy totally","A half-beaten enemy returns for revenge. Finish the job."],
["Use absence to increase respect","Too much presence breeds contempt. Withdraw and value rises."],
["Keep others in suspense","Be unpredictable. People who can't read you can't control you."],
["Don't build fortresses","Isolation exposes you. Circulate and stay connected."],
["Know who you're dealing with","Misjudge a person and you make an enemy. Study before you act."],
["Don't commit to anyone","Stay independent and let others compete for your favor."],
["Seem dumber than your mark","Let them feel clever while you quietly outmaneuver them."],
["Use surrender as a tactic","Yield to buy time, then rise stronger when they relax."],
["Concentrate your forces","Focus on one powerful source rather than scattering your energy."],
["Play the perfect courtier","Master subtle flattery, social grace, and the politics of the room."],
["Re-create yourself","Craft your own identity. Don't accept the role others assign you."],
["Keep your hands clean","Let others take the risks and blame. Stay above mistakes."],
["Play on people's need to believe","People crave faith. Offer a cause and followers appear."],
["Enter action with boldness","Hesitation invites doubt. If you act, commit fully."],
["Plan all the way to the end","Think through every consequence before your first move."],
["Make accomplishments look effortless","Hide the sweat. Ease makes talent look magical."],
["Control the options","Offer choices that all lead where you want."],
["Play to people's fantasies","Reality disappoints. Give them a dream and they follow."],
["Find each person's weakness","Everyone has an insecurity or need. Find it and you hold the lever."],
["Act like a king to be treated like one","Carry yourself with confidence and others will grant you status."],
["Master the art of timing","Know when to wait and when to strike. Never rush."],
["Disdain things you can't have","Showing interest gives power away. Walk away instead."],
["Create compelling spectacles","Use bold images and symbols. Visuals sway more than words."],
["Think as you like, behave like others","Don't flaunt your originality. Blend in, then act on your terms."],
["Stir up waters to catch fish","Angry people make errors. Stay calm and provoke them."],
["Despise the free lunch","Cheap offers carry hidden costs. Pay fairly to stay free."],
["Avoid stepping into a great man's shoes","Succeeding a legend is a trap. Make a clean break and your own mark."],
["Strike the shepherd, scatter the sheep","Target the troublemaker or leader and the group falls apart."],
["Work on hearts and minds","Coercion breeds resentment. Win emotions and people follow willingly."],
["Disarm with the mirror effect","Mimic your opponent's moves. They'll feel understood and confused."],
["Preach change, but don't change too much at once","People want reform, not upheaval. Honor tradition while you innovate."],
["Never appear too perfect","Show a small flaw. Perfection breeds envy."],
["Don't go past the mark you aimed for","Know when to stop. Victory pushed too far turns into defeat."],
["Assume formlessness","Stay fluid and adaptable. A shape that can't be pinned can't be attacked."]
];
const N = L.length, stack = document.getElementById('stack'), count = document.getElementById('count');
let i = 0, busy = false;

function cardEl(n) {
  const h = (n * 37 + 10) % 360;
  const el = document.createElement('article');
  el.className = 'card absolute inset-0 rounded-3xl overflow-hidden flex flex-col shadow-2xl';
  el.style.background = `linear-gradient(160deg, hsl(${h} 45% 22%), hsl(${(h+30)%360} 50% 9%))`;
  el.style.border = '1px solid rgba(255,255,255,.12)';
  el.innerHTML = `
    <div class="flex-1 flex items-center justify-center relative">
      <span class="serif font-extrabold leading-none select-none" style="font-size:min(46vw,12rem);color:hsl(${h} 70% 72%);opacity:.9">${n+1}</span>
      <span class="stamp keep absolute top-8 left-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-emerald-400 text-emerald-400" style="opacity:0;transform:rotate(-14deg)">KEEP</span>
      <span class="stamp pass absolute top-8 right-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-rose-400 text-rose-400" style="opacity:0;transform:rotate(14deg)">PASS</span>
    </div>
    <div class="p-6 pt-8" style="background:linear-gradient(to top, rgba(0,0,0,.65), transparent)">
      <h2 class="serif text-2xl font-extrabold leading-tight mb-2">${L[n][0]}</h2>
      <p class="text-base leading-relaxed" style="color:#e4d9c8">${L[n][1]}</p>
    </div>`;
  return el;
}

function render() {
  stack.innerHTML = '';
  const back = cardEl((i + 1) % N);
  back.style.transform = 'scale(.94) translateY(14px)';
  back.style.opacity = '.7';
  back.style.pointerEvents = 'none';
  const top = cardEl(i);
  stack.append(back, top);
  count.textContent = `${i + 1} / ${N}`;
  attach(top);
  busy = false;
}

function attach(el) {
  let sx = 0, sy = 0, dx = 0, drag = false;
  const keep = el.querySelector('.keep'), pass = el.querySelector('.pass');
  const pose = (x, y) => {
    el.style.transform = `translate(${x}px, ${y}px) rotate(${x / 18}deg)`;
    keep.style.opacity = Math.max(0, Math.min(1, x / 100));
    pass.style.opacity = Math.max(0, Math.min(1, -x / 100));
  };
  el.addEventListener('pointerdown', e => { if (busy) return; drag = true; sx = e.clientX; sy = e.clientY; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - sx; pose(dx, (e.clientY - sy) * .3); });
  const end = () => {
    if (!drag) return; drag = false;
    if (Math.abs(dx) > 90) fly(dx > 0 ? 1 : -1);
    else { el.style.transition = 'transform .25s'; pose(0, 0); }
    dx = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function fly(dir) {
  if (busy) return; busy = true;
  const el = stack.lastElementChild;
  el.style.transition = 'transform .3s ease-in, opacity .3s';
  el.style.transform = `translate(${dir * 520}px, 40px) rotate(${dir * 24}px)`.replace(/rotate\((-?\d+)px\)/, 'rotate($1deg)');
  el.style.opacity = '0';
  setTimeout(() => { i = (i + 1) % N; render(); }, 280);
}

function prev() { if (busy) return; i = (i - 1 + N) % N; render(); }

document.getElementById('pass').onclick = () => fly(-1);
document.getElementById('keep').onclick = () => fly(1);
document.getElementById('back').onclick = prev;
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') fly(1);
  else if (e.key === 'ArrowLeft') fly(-1);
  else if (e.key === 'Backspace') prev();
});
render();
</script>
<script id="data">
const D={};
/*BATCH1*/Object.assign(D,{
0:{s:"Make your superiors feel superior. If you display your talents too brilliantly, you risk triggering insecurity, and insecure bosses can sabotage or replace you.",k:["Let your boss take credit for your ideas and successes.","Flatter subtly by seeming to depend on their wisdom.","Downplay your own talents when in their presence."],x:"Nicolas Fouquet, Louis XIV's finance minister, threw a lavish party at his chateau that outshone the king's own court. Months later, Louis had him arrested and imprisoned for life.",t:"Visible brilliance is only an asset if it makes the person above you look good.",c:"It's cynical advice and depends on the boss. Secure leaders reward talent, and in those environments, hiding your abilities just wastes them."},
1:{s:"Friends know your weak spots and often envy your success, while a reconciled enemy has something to prove. Judge people by their interests, not their affection.",k:["Hire for skill, not sentiment.","Win over former rivals; they work harder to show loyalty.","Keep a worthy rival around to stay sharp."],x:"Emperor Michael III promoted his friend Basilius, a former stable hand, to the highest offices. In 867, Basilius had him murdered and took the throne.",t:"Trust is easy to give and costly to recover. Check motives before you hand over power.",c:"Treating everyone as a potential threat is lonely and corrosive. Real trust is what makes teams work."},
2:{s:"If people can't see where you're headed, they can't block you. Hide your true aims behind decoys and harmless talk until it's too late to stop you.",k:["Mislead with false goals and red herrings.","Never reveal your plans to those who might object.","Use small talk to cover your real moves."],x:"Bismarck hid his plan to unify Germany under Prussia. He joined Austria against Denmark in 1864, then turned on Austria in 1866 and won.",t:"Surprise is a weapon, and it only works if no one sees it coming.",c:"Secrecy erodes trust. Teams need clear direction, and if your deception is exposed, the damage can outlast any win."},
3:{s:"The more you talk, the more ordinary you sound and the more you reveal. Silence makes you seem deeper and keeps others unsettled.",k:["Keep your plans and opinions to yourself.","Let others fill silences and give themselves away.","Short, firm statements carry more weight."],x:"The Roman general Coriolanus told the common people exactly what he thought of them. They turned on him and he was banished from Rome.",t:"Every extra word is a chance to say something you can't take back.",c:"Silence can read as evasion. In collaboration, clear and open communication is its own kind of power."},
4:{s:"Reputation is a form of currency. A strong one makes people believe the best of you, while a damaged one makes everything harder.",k:["Build a distinct, consistent reputation and protect it.","Destroy a rival's good name indirectly.","Ignore small attacks and answer big ones with action."],x:"In Shakespeare's Julius Caesar, Antony repeats that Brutus is an honourable man until the phrase turns to irony, wrecking the reputation that shielded the conspirators.",t:"Your name opens doors or closes them before you ever speak.",c:"Obsessing over image can make you timid. A reputation built on real integrity needs less defending."},
5:{s:"Standing out beats blending in. Being ignored is worse than being criticized, so make yourself visible and unforgettable.",k:["Be bold and dramatic, even outrageous.","Create a striking image people remember.","Use controversy and curiosity to draw eyes."],x:"P.T. Barnum turned a child performer, Charles Stratton, into the world-famous General Tom Thumb through relentless publicity and showmanship.",t:"Attention is the first step to influence. Without it you don't get a chance to be judged.",c:"Attention fades fast and can turn into scrutiny. Fame without substance doesn't last."},
6:{s:"Use the skill, time and money of others to advance your goals, then present the result as yours. It saves energy and builds your image.",k:["Delegate the labor, keep the story.","Borrow expertise rather than build it all yourself.","Make sure your name is attached to the outcome."],x:"Thomas Edison's Menlo Park lab employed teams of engineers and machinists whose work was largely credited to Edison himself, the Wizard of Menlo Park.",t:"Leverage other people's effort, but own the narrative.",c:"Taking credit breeds resentment and talent walks. Sharing credit builds loyalty that outlasts a headline."},
7:{s:"When you make others come to you, you set the terms and stay calm while they act rashly. Control the pace and location of the encounter.",k:["Let rivals chase while you conserve energy.","Use bait to lure them where you want.","Make them move first and you decide the response."],x:"Sun Tzu wrote that the army that holds the battlefield and waits is fresh, while the one that arrives late and rushes in is exhausted.",t:"The person who moves less often controls the game.",c:"Waiting can mean missing chances. Sometimes a quick, direct move beats a clever delay."},
8:{s:"Argue and you may win a point but lose the person. A demonstration persuades without making anyone feel attacked.",k:["Prove your point with results, not rhetoric.","Avoid debates that wound pride.","Let others reach the conclusion themselves."],x:"Galileo invited scholars to look through his telescope at Jupiter's moons. Some reportedly refused, showing that demonstration only works on those willing to look.",t:"Show, don't tell. Results speak louder than the best argument.",c:"Not everything can be demonstrated in advance. Sometimes a clear explanation is the right tool."},
9:{s:"Moods and misfortune spread like infection. Chronic pessimists drag down your energy and reputation, so choose your company carefully.",k:["Notice who lifts you and who drains you.","Be wary of people who always see disaster.","Surround yourself with the capable and cheerful."],x:"A 2008 study by Nicholas Christakis and James Fowler found that happiness spreads through social networks, with happy friends raising your own chances of being happy.",t:"Your circle shapes your outlook, so pick it on purpose.",c:"Dropping people in genuine hardship is callous. Support those going through a bad patch, and keep distance from those who stay negative by habit."},
10:{s:"If you're needed, you can't be discarded. Make yourself the one source of something others can't easily replace.",k:["Develop a skill or knowledge only you hold.","Keep the information that makes you vital.","Never let your replacement be too easy."],x:"Bismarck made himself essential to Kaiser Wilhelm I and repeatedly threatened to resign when challenged, knowing the king couldn't manage without him.",t:"Dependence is the strongest job security there is.",c:"Hoarding knowledge makes teams fragile and you a bottleneck. Mentoring others earns more lasting respect."},
11:{s:"One honest or generous act can lower a target's guard for a long time. Use real candor selectively to hide what you don't disclose.",k:["Confess a small flaw to appear trustworthy.","Give a gift or favor to create obligation.","Make your sincerity seem effortless and rare."],x:"Con man Victor Lustig won his marks' trust by seeming candid and well-connected, then sold the Eiffel Tower in 1925 to a scrap-metal dealer.",t:"A small, genuine gesture buys a lot of slack.",c:"If people discover the strategy, trust collapses. Honesty works best when it's the real thing, not a tactic."}
});
</script><!--ENDD-->

const B=[
["Let your boss take credit for your ideas.","Seem to depend on their wisdom.","Fouquet's party outshone Louis XIV's court. He was jailed for life.","Shine only in ways that make the person above you look good."],
["Friends know your weak spots and envy your wins.","A reformed enemy works harder to prove loyalty.","Emperor Michael III promoted his friend Basilius, who later had him killed.","Trust is earned. Test it before you hand it over."],
["Hide your goal behind decoys and small talk.","Mislead with false trails.","Bismarck cloaked his aims in diplomacy until it was too late to stop him.","If they can't see where you're headed, they can't block you."],
["Words reveal your plans and your flaws.","Silence makes you seem deep and unpredictable.","Coriolanus spoke bluntly and was exiled by the Romans he'd led.","The less you say, the more weight each word carries."],
["Reputation is power you can spend.","Attack a rival's good name before they attack yours.","In Julius Caesar, Antony's funeral speech turned Brutus's honor into irony.","Build it carefully and defend it fiercely."],
["Be bold, even outrageous, to stand out.","Being ignored is worse than being criticized.","P.T. Barnum turned stunts and headlines into fame and fortune.","Visibility gets you the chance to be judged at all."],
["Use others' skill, time and money.","Present the finished work as yours.","Edison's lab staff did much of the inventing, but his name carried the fame.","Delegate the labor, but own the story."],
["Make people come to you so you set the terms.","Waiting keeps you calm while they act rashly.","Sun Tzu advised arriving first and letting the enemy rush in tired.","The one who moves less often controls the game."],
["Arguments breed resentment even if you win.","A demonstration persuades without a fight.","Galileo invited skeptics to simply look through his telescope.","Show, don't tell."],
["Moods and misfortune spread like infection.","Pessimists drag your energy and reputation down.","A coworker who always complains slowly sours the whole team.","Choose company that raises your standard."],
["Be the one skill or source they can't replace.","Make yourself needed, not just liked.","Bismarck made himself indispensable to Kaiser Wilhelm I.","Dependence is the strongest job security."],
["One honest or generous act creates a halo.","Use it to cover the moves you don't disclose.","A well-timed confession can make a skeptic stop looking for more.","Give a little real trust and you buy a lot of slack."],
["People act for their own gain, not out of kindness.","Show what's in it for them.","Pitch the deal as their win and gratitude never needs to enter.","Ask for help in terms of their benefit."],
["Ask casual questions and listen closely.","Friendly chat hides your probing.","Most useful intelligence is shared freely over coffee.","Information lets you move before others know."],
["Half-defeated enemies wait and plot revenge.","Finish what you start.","Rome razed Carthage in 146 BC to end the threat for good.","If you strike, strike completely."],
["Too much presence makes you ordinary.","Withdrawal makes people value you more.","Greta Garbo left public life and her mystique only grew.","Be scarce, not constantly available."],
["Unpredictability keeps people off balance.","Surprise creates respect and fear.","A leader who shifts tactics can't be easily read or countered.","Keep them guessing."],
["Isolation cuts you off from information and allies.","Walls give a false sense of safety.","The Maginot Line was bypassed by Germany in 1940.","Stay in the flow of people."],
["Misreading someone makes enemies.","Study motives before you act.","Insulting a vengeful person has ruined many careers.","Know your target before you aim."],
["Staying neutral lets others court you.","Commitment gives away your leverage.","Elizabeth I kept suitors hopeful by never marrying any.","Independence is power."],
["Let them feel smarter than you.","Underestimated people get access.","TV detective Columbo disarmed suspects by seeming scatterbrained.","Never show all your cards."],
["Yield to buy time and lull them.","Obedience can be strategy, not defeat.","King Goujian of Yue served his conqueror, then later defeated him.","Retreat is not the same as losing."],
["Scattered effort is weak effort.","Find the one source of power and commit.","Rockefeller took over oil refining first, then everything else followed.","Depth beats breadth."],
["Master flattery, grace and social reading.","Know the room's politics.","Castiglione's Book of the Courtier became a manual for court life.","Charm smooths the road to influence."],
["Don't accept the role others give you.","Craft an identity with drama and flair.","David Bowie kept reinventing personas and stayed ahead of his fans.","Be the author of your image."],
["Use others as a shield from blame.","Look innocent of the dirty work.","Cesare Borgia had his harsh governor executed to calm the people he'd angered.","Let the scapegoat take the fall."],
["People crave something to believe in.","Offer a cause and followers appear.","Sabbatai Zevi was proclaimed messiah in 1666 and drew masses.","Give hope and you get loyalty."],
["Hesitation invites doubt.","Boldness hides mistakes.","Cortés reportedly burned his ships to leave no way back.","Commit fully or don't act."],
["Think through every consequence first.","Those who don't plan end up improvising badly.","Napoleon's Russian campaign had no exit plan and ended in disaster.","Know the finish line before you start."],
["Hide your effort and tricks.","Ease looks like genius.","A pianist who plays flawlessly seems born to it, not drilled.","Sweat is for backstage."],
["Offer choices that all benefit you.","Guide people while they feel free.","Offering two meeting times keeps the meeting itself decided.","Frame the options and you frame the outcome."],
["Reality bores and disappoints.","A dream or fantasy captivates.","Advertisers sell lifestyles, not products.","Offer the escape from the ordinary."],
["Everyone has an insecurity or craving.","Find it and you hold the lever.","A flatterer finds your pride and plays on it.","Use the knowledge carefully."],
["Confidence gets mirrored by others.","If you act like you matter, people grant status.","Columbus bargained for titles before sailing.","Your self-presentation sets your price."],
["Never rush. Never be late.","Know when to wait and when to strike.","A negotiator who lets the other side get tired often wins the better deal.","Patience wins over haste."],

function back(n,h){

   :`<div>${lab('Key ideas:')}<ul class="list-disc pl-5 space-y-1 mt-1"><li>${k1}</li><li>${k2}</li></ul></div><p>${lab('Example:')} ${ex}</p><p>${lab('The takeaway:')} ${tk}</p>`;
  return `<div class="face absolute inset-0 rounded-3xl overflow-y-auto p-5 flex flex-col gap-3 shadow-2xl text-[14px] leading-snug" style="backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);color:#e4d9c8;border:1px solid rgba(255,255,255,.12);background:linear-gradient(170deg, hsl(${h} 30% 15%), hsl(${(h+30)%360} 35% 7%))"><div class="flex items-center gap-3"><span class="text-3xl">${E[n]}</span><h2 class="serif text-lg font-extrabold leading-tight" style="color:var(--ink)">Law ${n+1}: ${L[n][0]}</h2></div>${body}</div>`;

function flip(el){const i=el.querySelector('.inner'),f=!i.style.transform;i.style.transform=f?'rotateY(180deg)':'';el.style.touchAction=f?'pan-y':'none';}
function front(n,h){
  return `<div class="face absolute inset-0 rounded-3xl overflow-hidden flex flex-col justify-end shadow-2xl" style="backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(255,255,255,.12);background:#000">
    <img src="${IM[n%IM.length]}" alt="" draggable="false" class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none">

    <span class="absolute top-4 left-4 serif font-extrabold text-sm px-3 py-1 rounded-full" style="background:rgba(0,0,0,.45);color:hsl(${h} 70% 82%);backdrop-filter:blur(6px)">Law ${n+1}</span>
    <span class="absolute top-3 right-4 w-11 h-11 rounded-full flex items-center justify-center text-2xl" style="background:rgba(0,0,0,.4);backdrop-filter:blur(6px)">${E[n]}</span>
    <span class="stamp keep absolute top-20 left-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-emerald-400 text-emerald-400" style="opacity:0;transform:rotate(-14deg)">KEEP</span>
    <span class="stamp pass absolute top-20 right-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-rose-400 text-rose-400" style="opacity:0;transform:rotate(14deg)">PASS</span>
    <div class="relative p-6 pt-8" style="text-shadow:0 2px 12px rgba(0,0,0,.7)">
      <h2 class="serif text-2xl font-extrabold leading-tight mb-2">${L[n][0]}</h2>

      <p class="text-xs mt-3" style="color:#c9bca9">Tap to flip for the full idea</p>
    </div>
  </div>`;
}
function cardEl(n){
  const h=(n*37+10)%360, [k1,k2,ex,tk]=B[n];

    ${front(n,h)}
    ${back(n,h)}
  </div>`;
  return el;
}
function attach(el){
  let sx=0,sy=0,dx=0,drag=false,flipped=false;
  const inner=el.querySelector('.inner'),keep=el.querySelector('.keep'),pass=el.querySelector('.pass');
  const pose=(x,y)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${x/18}deg)`;
    keep.style.opacity=Math.max(0,Math.min(1,x/100));pass.style.opacity=Math.max(0,Math.min(1,-x/100));};
  el.addEventListener('pointerdown',e=>{if(busy)return;drag=true;dx=0;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.style.transition='none';});
  el.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;pose(dx,(e.clientY-sy)*.3);});
  const end=e=>{
    if(!drag)return;drag=false;
    if(Math.abs(dx)>90)fly(dx>0?1:-1);
    else{
      el.style.transition='transform .25s';pose(0,0);
      if(Math.abs(dx)<6&&e.type==='pointerup'){flip(el);}
    }
    dx=0;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

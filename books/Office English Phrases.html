<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office English · Vol 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14100f; --ink:#f6efe4; --muted:#a79b8c; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
  .serif { font-family:Fraunces,Georgia,serif; }
  .card { touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
  .card:active { cursor:grabbing; }
  button:focus-visible { outline:2px solid #e8c36a; outline-offset:3px; }
  #nl-badge-frame { display:none !important; }
</style>
</head>
<body>
<main class="h-full max-w-md mx-auto flex flex-col px-4 py-3">
  <header class="flex items-baseline justify-between mb-3 gap-3">
    <h1 id="title" class="serif text-xl font-extrabold leading-tight"></h1>
    <span id="count" class="text-sm whitespace-nowrap" style="color:var(--muted)"></span>
  </header>
  <div id="stack" class="relative flex-1 min-h-0"></div>
  <nav class="flex items-center justify-center gap-6 pt-4 pb-2" aria-label="Card controls">
    <button id="prev" aria-label="Previous card" class="w-16 h-16 rounded-full border-2 border-amber-300 text-amber-300 active:scale-90 transition">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button id="favview" aria-label="Show favourite cards only" aria-pressed="false" class="relative w-14 h-14 rounded-full border-2 border-pink-400 text-pink-400 text-2xl active:scale-90 transition">♥<span id="favn" class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full text-[11px] leading-5 font-semibold bg-pink-400 text-black">0</span></button>
    <button id="next" aria-label="Next card" class="w-16 h-16 rounded-full border-2 border-emerald-400 text-emerald-400 active:scale-90 transition">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </nav>
  <p id="hint" class="text-center text-xs pb-1" style="color:var(--muted)"></p>
</main>

<script>
const CARDS = [{"title": "Prioritize", "front": "Rank by importance.", "emoji": "📌", "s": "A verb for ranking tasks so the most valuable work comes first. Common in sprint and backlog talk.", "k": ["We need to prioritize the security fixes this sprint.", "Let's prioritize tasks by customer impact.", "Without a clear rubric, teams struggle to prioritize."], "x": "She asked us to prioritize reliability over new features.", "t": "Name the criterion: prioritize by risk, cost or customer impact.", "c": "Saying everything is a priority means nothing is."}, {"title": "Scope", "front": "The boundaries of the work.", "emoji": "🔭", "s": "The boundaries of what a project will and won't deliver. Often used when work grows beyond the plan.", "k": ["The scope of this project has doubled since kickoff.", "That feature is out of scope for Q4.", "Any change to scope must go through the change request process."], "x": "We agreed to freeze the scope until launch.", "t": "Agree the scope in writing before estimating.", "c": "\"Out of scope\" can sound dismissive; offer a later date."}, {"title": "Dependency", "front": "Something you rely on.", "emoji": "🔗", "s": "Something your work relies on, such as a team, tool or decision. Mapping them early prevents surprises.", "k": ["The migration has a hard dependency on the platform team.", "We should map all dependencies before committing to a date.", "Third-party dependencies need regular security updates."], "x": "We can't start until the dependency is resolved.", "t": "Name the owner and the date for each dependency.", "c": "Too many dependencies often signal a design problem."}, {"title": "Bottleneck", "front": "A point that slows everything.", "emoji": "🚧", "s": "The one point where work piles up and slows the whole flow. Fixing it speeds everything.", "k": ["Code review has become our main bottleneck.", "Let's remove the bottleneck in the testing pipeline.", "The bottleneck is one reviewer who approves every release."], "x": "Adding more developers won't fix the bottleneck.", "t": "Find the bottleneck with data before adding people.", "c": "Removing one bottleneck usually reveals the next."}, {"title": "Milestone", "front": "A key checkpoint.", "emoji": "🏁", "s": "A key checkpoint that shows real progress toward the goal. Use it in plans and status updates.", "k": ["We hit the second milestone two days early.", "Each milestone has a clear owner.", "Reaching this milestone unlocks the next funding phase."], "x": "The team celebrated the milestone with a short demo.", "t": "Make each milestone verifiable, not vague.", "c": "Too many milestones turn planning into bureaucracy."}, {"title": "Deliverable", "front": "Something to be handed over.", "emoji": "📦", "s": "A concrete thing handed over, such as a document, feature or report. Clients and managers track these.", "k": ["The key deliverable this month is the API specification.", "Please confirm the deliverables with the client.", "Each deliverable needs a named reviewer."], "x": "The final deliverable is a migration runbook.", "t": "State the deliverable, the owner and the date together.", "c": "Confusing deliverables with activities hides real progress."}, {"title": "Contingency", "front": "A backup provision.", "emoji": "🛟", "s": "Time or budget reserved for things going wrong. A sign of mature planning.", "k": ["We've built a two-week contingency into the timeline.", "What's our contingency if the vendor delays?", "The contingency budget covers up to ten percent overrun."], "x": "We activated the contingency plan after the outage.", "t": "Show your contingency openly in the plan.", "c": "Hidden padding erodes trust when it's discovered."}, {"title": "Feasible", "front": "Realistically doable.", "emoji": "✅", "s": "Realistically possible given time, people and budget. A polite way to question an ambitious plan.", "k": ["A full rollout by March isn't feasible.", "Is it feasible to split the release in two?", "Technically it's feasible, but it would take months."], "x": "We're assessing whether the idea is commercially feasible.", "t": "Say \"not feasible by March, but feasible by May\".", "c": "\"Not feasible\" alone sounds like a blunt refusal."}, {"title": "Allocate", "front": "Assign resources.", "emoji": "🧮", "s": "To assign people, time or money to specific work. Used in planning and budgeting.", "k": ["We'll allocate two engineers to the performance work.", "The budget was allocated across three initiatives.", "How should we allocate time between features and bugs?"], "x": "Resources were allocated before the scope was confirmed.", "t": "Say who gets what and why.", "c": "Allocating 100% of anyone's time leaves no room for surprises."}, {"title": "Streamline", "front": "Make more efficient.", "emoji": "🪄", "s": "To make a process simpler and faster by removing waste. Popular in process improvement talks.", "k": ["We streamlined onboarding to cut setup time.", "Let's streamline our approval workflow.", "Streamlining the reporting saved us five hours a week."], "x": "We need to streamline communication between squads.", "t": "Quote the saving: \"cut setup from 2 days to 2 hours\".", "c": "Streamlining can remove useful safeguards too."}, {"title": "On track", "front": "Progressing as planned.", "emoji": "🟢", "s": "Progressing as planned, with no real risk to the date. Standard in status reports.", "k": ["The release is on track for the 15th.", "Most workstreams are on track.", "Are we still on track to meet the audit deadline?"], "x": "Despite the incident, the project remains on track.", "t": "Back it up with one fact, not just a colour.", "c": "Reporting \"on track\" until the last week damages credibility."}, {"title": "Slip", "front": "Fall behind schedule.", "emoji": "⏳", "s": "To fall behind schedule. Use it to give an early warning.", "k": ["The launch date may slip by a week.", "Two tasks have slipped due to illness.", "Let's make sure the testing phase doesn't slip."], "x": "If the vendor slips, we'll have to re-plan.", "t": "Warn early: \"this may slip by a week\".", "c": "Saying it slipped without a recovery plan alarms people."}, {"title": "Escalate", "front": "Raise to a higher level.", "emoji": "📣", "s": "To raise an issue to someone with more authority. A normal step, not a failure.", "k": ["I'll escalate this to the director if it isn't resolved by Friday.", "We escalated the outage to the vendor immediately.", "Don't wait too long to escalate a critical risk."], "x": "Issues should be escalated through the proper channel.", "t": "Escalate with facts, impact and a proposed action.", "c": "Escalating too fast can damage trust with peers."}, {"title": "Blocker", "front": "Something stopping progress.", "emoji": "⛔", "s": "Anything stopping a person or team from progressing. Raise it at stand-up.", "k": ["The main blocker is access to the staging environment.", "Please flag any blockers in the stand-up.", "Unclear requirements were the biggest blocker this sprint."], "x": "Let me know if the blocker is still open tomorrow.", "t": "Pair each blocker with an owner and a date.", "c": "A vague blocker is just a complaint."}, {"title": "Headwinds", "front": "Obstacles working against you.", "emoji": "🌬️", "s": "Forces that make progress harder, such as budget cuts or hiring freezes. Good for executive updates.", "k": ["We're facing headwinds from the hiring freeze.", "Despite the headwinds, we delivered on time.", "Market headwinds forced us to revise the forecast."], "x": "We expect headwinds when the new policy starts.", "t": "Name the headwind, then say how you're handling it.", "c": "Overusing it can sound like excuse-making."}, {"title": "Traction", "front": "Momentum; gaining ground.", "emoji": "🚀", "s": "Early momentum or growing adoption. Used for products, ideas and projects.", "k": ["The new tool is gaining traction across teams.", "We've finally got some traction on the backlog.", "The pilot is gaining traction with the finance team."], "x": "We need more traction before asking for funding.", "t": "Back \"gaining traction\" with a number.", "c": "Early traction doesn't guarantee lasting success."}, {"title": "Setback", "front": "A delay or problem.", "emoji": "🩹", "s": "A delay or problem that slows progress but doesn't end it. Soft in tone, useful in updates.", "k": ["The failed test was a minor setback.", "We recovered quickly from the setback.", "Losing two engineers was a serious setback."], "x": "Every setback taught us something useful.", "t": "Pair the setback with the recovery plan.", "c": "Calling a serious problem a \"setback\" can look like spin."}, {"title": "Pivot", "front": "Change direction strategically.", "emoji": "🔀", "s": "To change strategic direction in response to new information. Often used for products and plans.", "k": ["We decided to pivot to an off-the-shelf solution.", "The team pivoted after the customer feedback.", "We may need to pivot if the pilot fails."], "x": "The pivot saved us three months of work.", "t": "Explain what you learned that justified the pivot.", "c": "Frequent pivots signal weak planning."}, {"title": "Wrap up", "front": "Finish.", "emoji": "🎬", "s": "To finish or bring to a close. Good for ending meetings and projects.", "k": ["We expect to wrap up testing by Wednesday.", "Let's wrap up this discussion and move on.", "Let's wrap up with next steps and owners."], "x": "We're wrapping up the migration this week.", "t": "Wrap up with next steps, owners and dates.", "c": "Wrapping up without actions wastes the meeting."}, {"title": "Outstanding", "front": "Still unresolved.", "emoji": "📋", "s": "Not yet finished or resolved. Common for tasks, invoices and questions.", "k": ["There are three outstanding issues to address.", "The outstanding items are on the last slide.", "Please clear the outstanding invoices by month end."], "x": "The only outstanding question is the budget.", "t": "List outstanding items on one slide with owners.", "c": "Leaving items outstanding for weeks signals poor follow-up."}, {"title": "Elaborate", "front": "Explain in more detail.", "emoji": "🔍", "s": "To explain something in more detail. Polite when you want someone to say more.", "k": ["Could you elaborate on the cost estimate?", "I'll elaborate on this point in a moment.", "I don't want to elaborate before we have the figures."], "x": "Would you elaborate on the risks you mentioned?", "t": "Ask \"Could you elaborate on...?\" to invite detail.", "c": "Elaborating too long loses senior listeners."}, {"title": "Recap", "front": "Summarize.", "emoji": "🔁", "s": "To briefly summarize what has been said or decided. Handy at the start or end of a meeting.", "k": ["Let me quickly recap where we are.", "To recap, we have three open risks.", "A quick recap will help new joiners catch up."], "x": "I'll send a recap of today's decisions.", "t": "Recap in three points maximum.", "c": "A long recap becomes a second meeting."}, {"title": "Highlight", "front": "Draw attention to.", "emoji": "🔦", "s": "To draw attention to something important. Use it before key figures or risks.", "k": ["I'd like to highlight the improvement in uptime.", "The report highlights several areas for improvement.", "The chart highlights where costs are rising."], "x": "Let me highlight one risk before we continue.", "t": "Highlight one or two points, not ten.", "c": "If everything is highlighted, nothing stands out."}, {"title": "Walk through", "front": "Explain step by step.", "emoji": "🚶", "s": "To explain something step by step. Typical in presentations and reviews.", "k": ["I'll walk you through the timeline.", "Can you walk us through your reasoning?", "I'll walk through the deployment steps tomorrow."], "x": "Could you walk me through the budget breakdown?", "t": "Say \"let me walk you through the plan\" to set structure.", "c": "Walking through every slide bores experienced audiences."}, {"title": "Underscore", "front": "Emphasize.", "emoji": "🖍️", "s": "To stress that something matters. Stronger than \"mention\", more formal than \"stress\".", "k": ["These figures underscore the need for more automation.", "The incident underscores why we need better monitoring.", "This outage underscores the value of redundancy."], "x": "The feedback underscores a gap in communication.", "t": "Use it to link data to your message.", "c": "It sounds heavy if used for minor points."}, {"title": "Concise", "front": "Brief but complete.", "emoji": "✂️", "s": "Brief but still complete. Valued in executive communication.", "k": ["Please keep your updates concise.", "A concise summary will help the executives.", "Be concise: the board has only ten minutes."], "x": "A concise email is more likely to be read.", "t": "Lead with the conclusion, then support it.", "c": "Too concise can leave out needed context."}, {"title": "Takeaway", "front": "The key lesson.", "emoji": "🎯", "s": "The main lesson or conclusion someone should remember. Ends reports and presentations well.", "k": ["The main takeaway is that we need earlier testing.", "What are your takeaways from the review?", "My key takeaway is to involve QA earlier."], "x": "One takeaway from the retro was clearer ownership.", "t": "Finish with one takeaway and one action.", "c": "Several takeaways dilute the message."}, {"title": "Align", "front": "Get on the same page.", "emoji": "🧭", "s": "To get people agreeing on direction or priorities. Used before decisions and launches.", "k": ["We need to align on priorities before the board meeting.", "Let's align the roadmap with company goals.", "Let's align with finance before sending the proposal."], "x": "Our goals must align with the company strategy.", "t": "Ask \"Are we aligned on...?\" before moving on.", "c": "Alignment in a meeting is not commitment afterwards."}, {"title": "Clarify", "front": "Make clear.", "emoji": "💡", "s": "To make something clear or resolve confusion. A polite way to check understanding.", "k": ["Let me clarify what I meant by \"done\".", "Could you clarify the deadline?", "I need to clarify the scope before we estimate."], "x": "Let me clarify: this is a proposal, not a decision.", "t": "Say \"Let me clarify\" instead of \"You're wrong\".", "c": "Constant clarifying can imply others aren't listening."}, {"title": "Reiterate", "front": "Say again for emphasis.", "emoji": "🔂", "s": "To say something again for emphasis. Useful for key decisions and deadlines.", "k": ["I want to reiterate that quality comes first.", "To reiterate, the freeze starts Monday.", "I'll reiterate the main risks in the summary."], "x": "Allow me to reiterate our commitment to the deadline.", "t": "Reiterate only the point that must not be missed.", "c": "Repeating too often sounds like distrust."}, {"title": "Benchmark", "front": "Standard for comparison.", "emoji": "🏷️", "s": "A standard you compare against, such as an industry figure. To benchmark is to measure against it.", "k": ["We benchmarked our latency against industry leaders.", "This figure is well above the benchmark.", "Our latency benchmark is checked every quarter."], "x": "Public benchmarks rarely match our workloads.", "t": "Cite the source and year of the benchmark.", "c": "Benchmarks from different contexts can mislead."}, {"title": "Baseline", "front": "Starting reference point.", "emoji": "📏", "s": "The starting measurement you compare future results with. Needed to prove improvement.", "k": ["We need a baseline before measuring improvement.", "Performance dropped below baseline after the release.", "We took the baseline before the new tool arrived."], "x": "Is the baseline measured on real traffic?", "t": "Record the baseline before the change.", "c": "A poor baseline makes any improvement look good."}, {"title": "Trend", "front": "General direction.", "emoji": "📈", "s": "The general direction of data over time. Used in reports and forecasts.", "k": ["The trend is encouraging: bugs are down 20%.", "We're seeing a worrying trend in customer complaints.", "The trend line has turned upward since March."], "x": "One quarter doesn't make a trend.", "t": "Say whether the trend is up, down or flat, and why.", "c": "One data point is not a trend."}, {"title": "Outlier", "front": "Unusual data point.", "emoji": "🎈", "s": "A data point far from the others. Often caused by a one-off event.", "k": ["That spike is an outlier caused by the outage.", "Let's exclude outliers from the average.", "One outlier skewed the whole average."], "x": "Check each outlier before removing it.", "t": "Explain outliers instead of silently removing them.", "c": "Dropping outliers can hide real problems."}, {"title": "Correlation", "front": "Statistical relationship.", "emoji": "🔗", "s": "A statistical relationship between two things. Common in analysis.", "k": ["There's a strong correlation between team size and delays.", "Correlation doesn't necessarily imply causation.", "Late tests correlate with more production bugs."], "x": "The two metrics correlate, but we don't know why.", "t": "Say \"correlated with\", not \"caused by\".", "c": "Correlation does not prove causation."}, {"title": "Quantify", "front": "Express as a number.", "emoji": "🔢", "s": "To express something as a number. Executives like impact stated in figures.", "k": ["Can we quantify the impact on revenue?", "It's hard to quantify the benefit of better documentation.", "Can we quantify the savings in hours per week?"], "x": "I'd like to quantify the risk before the meeting.", "t": "Quantify in time, money or percent.", "c": "Fake precision is worse than an honest range."}, {"title": "Margin", "front": "Room for error or profit.", "emoji": "↔️", "s": "The room left for error, or the profit gap. Used for deadlines and finance.", "k": ["We have a thin margin for error on this deadline.", "The new contract improves our margin.", "Our margin for error is only two days."], "x": "The margin shrank after the price cut.", "t": "Mention the margin: \"we have a two-day margin\".", "c": "A thin margin leaves no space for surprises."}, {"title": "Fluctuate", "front": "Vary up and down.", "emoji": "🌊", "s": "To rise and fall repeatedly. Typical for costs, demand and performance.", "k": ["Response times fluctuate during peak hours.", "Costs have fluctuated over the quarter.", "Server load fluctuates throughout the day."], "x": "Our headcount fluctuated during the merger.", "t": "Describe the range: \"fluctuates between 10 and 20 ms\".", "c": "Averages hide fluctuations."}, {"title": "Plateau", "front": "Level off.", "emoji": "🏔️", "s": "To level off after growth. Often signals a need for change.", "k": ["Productivity plateaued after the first month.", "Growth has plateaued this quarter.", "Adoption plateaued once the pilot ended."], "x": "Sales have plateaued, so we need a new idea.", "t": "Say when the plateau began.", "c": "A plateau may be natural, not a failure."}, {"title": "Variance", "front": "Difference from plan.", "emoji": "📊", "s": "The gap between planned and actual figures. A staple of budget reports.", "k": ["The variance against budget is under 3%.", "We need to explain the variance in cloud costs.", "The cloud bill shows a 5% variance this month."], "x": "Please explain any variance over 10%.", "t": "Explain variances over a set threshold.", "c": "Explaining every tiny variance wastes time."}, {"title": "Mitigate", "front": "Reduce the severity.", "emoji": "🛡️", "s": "To reduce how serious a risk is. A core risk-management verb.", "k": ["We can mitigate this risk with extra testing.", "Cross-training will mitigate the impact of absences.", "We'll mitigate the risk by testing earlier."], "x": "Training mitigates the impact of staff turnover.", "t": "Say how you mitigate: testing, backups, training.", "c": "Mitigating a risk is not removing it."}, {"title": "Root cause", "front": "Underlying reason.", "emoji": "🌱", "s": "The underlying reason a problem happened. Used in incident reviews.", "k": ["We traced the outage to a root cause in the config.", "Let's focus on the root cause, not the symptoms.", "The root cause was an expired certificate."], "x": "We keep asking why to find the root cause.", "t": "Ask \"why?\" until you reach a process cause.", "c": "Blaming a person is rarely the root cause."}, {"title": "Workaround", "front": "Temporary solution.", "emoji": "🩺", "s": "A temporary solution that avoids a problem until a real fix arrives. Common in tech.", "k": ["There's a workaround until the patch is ready.", "We can't rely on this workaround long-term.", "This workaround buys us a week."], "x": "Document the workaround so others can use it.", "t": "Label a workaround clearly as temporary.", "c": "Workarounds often become permanent."}, {"title": "Trade-off", "front": "A compromise between two things.", "emoji": "⚖️", "s": "Gaining one thing by giving up another. Appears in every design decision.", "k": ["There's a trade-off between speed and quality.", "We accepted the trade-off to meet the deadline.", "We accepted slower delivery as a trade-off."], "x": "Every design choice is a trade-off.", "t": "State what you gain and what you sacrifice.", "c": "Not all trade-offs are equal; weigh the costs."}, {"title": "Fallout", "front": "Negative consequences.", "emoji": "💥", "s": "The negative consequences that follow an event. Used for incidents and bad decisions.", "k": ["The fallout from the data breach lasted months.", "We need to manage the fallout from this delay.", "The fallout from the delay reached the board."], "x": "We're still dealing with the fallout.", "t": "Plan how to handle the fallout before announcing.", "c": "Ignoring fallout turns small issues into crises."}, {"title": "Pitfall", "front": "Hidden danger.", "emoji": "🕳️", "s": "A hidden danger in a plan or process. Warn colleagues about common ones.", "k": ["One common pitfall is underestimating integration work.", "Let's avoid the pitfalls from the last project.", "A common pitfall is skipping integration tests."], "x": "Poor handover is a classic pitfall.", "t": "Share the pitfalls you learned from past projects.", "c": "Listing too many pitfalls can scare people off."}, {"title": "Safeguard", "front": "Protective measure.", "emoji": "🔒", "s": "A measure that protects against harm or error. Used in safety and quality talk.", "k": ["We added safeguards to prevent accidental deletion.", "Code review acts as a safeguard against defects.", "Code review is our main safeguard."], "x": "We added safeguards against accidental deletion.", "t": "Describe the safeguard and what it prevents.", "c": "Safeguards that slow work get bypassed."}, {"title": "Remediate", "front": "Fix a problem.", "emoji": "🧰", "s": "To fix a problem, especially a security or data issue. Formal and precise.", "k": ["We'll remediate the vulnerabilities by Friday.", "The team is remediating the data issues now.", "We'll remediate the critical issues by Friday."], "x": "Remediating the data took two weeks.", "t": "Give the date you'll remediate by.", "c": "It's formal; use \"fix\" in casual chat."}, {"title": "Anticipate", "front": "Expect and prepare for.", "emoji": "🔮", "s": "To expect something and prepare for it. Shows foresight in planning.", "k": ["We anticipate some resistance to the change.", "Anticipating demand, we scaled up early.", "We anticipate pushback from finance."], "x": "Anticipating demand, we hired early.", "t": "Say what you anticipate and what you'll do.", "c": "Anticipating everything leads to over-planning."}, {"title": "Exacerbate", "front": "Make worse.", "emoji": "🔥", "s": "To make a bad situation worse. Used for incidents and conflicts.", "k": ["Rushing the release would only exacerbate the problem.", "The staff shortage exacerbated the delays.", "Overtime would only exacerbate the burnout."], "x": "The delay exacerbated tensions between teams.", "t": "Warn that a quick fix could exacerbate the problem.", "c": "Don't confuse it with \"aggravate\", which is more personal."}, {"title": "Delegate", "fron const IM = [];

const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
try { const v = parseInt(localStorage.getItem(K), 10); if (v >= 0 && v < N) i = v; } catch (e) {}

const list = () => showFav ? [...favs].sort((a, b) => a - b) : [...Array(N).keys()];
function step(d) {
  const L = list();
  if (!L.length) return i;
  const p = L.indexOf(i);
  if (p >= 0) return L[(p + d + L.length) % L.length];
  if (d > 0) return L.find(x => x > i) ?? L[0];
  return [...L].reverse().find(x => x < i) ?? L[L.length - 1];
}
if (showFav && !favs.has(i)) i = step(1);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

e principal blocker remains the outstanding security clearance.", "Blockers should be reported to the project manager within 24 hours."], ["The organisation continues to face significant headwinds in the recruitment market.", "Despite these headwinds, the team met all contractual commitments."], ["The pilot has gained considerable traction among regional business units.", "Further investment is justified by the traction achieved to date."], ["The failure of the acceptance test constituted a minor setback.", "We have recovered from the setback and revised the schedule accordingly."], ["Following the pilot, management elected to pivot towards a partner-led model.", "The proposed pivot is supported by customer research."], ["We anticipate wrapping up the testing phase by the end of the week.", "To wrap up, I would like to summarise the key decisions."], ["The outstanding items are listed in the attached action log.", "All outstanding invoices should be settled by month end."], ["I would be grateful if you could elaborate on the assumptions behind this estimate.", "I will elaborate on these findings in the following section."], ["By way of recap, three risks remain open.", "Allow me to recap the decisions taken at the previous meeting."], ["I would like to highlight a significant improvement in system availability.", "The report highlights several areas requiring management attention."], ["I will now walk you through the proposed implementation timeline.", "The team walked the board through three funding scenarios."], ["These findings underscore the need for greater investment in automation.", "The incident underscores the importance of robust monitoring."], ["Please keep submissions concise and limited to two pages.", "A concise summary has been prepared for the executive committee."], ["The principal takeaway is that earlier testing reduces overall cost.", "Key takeaways will be circulated following the review."], ["It is essential that we align on priorities ahead of the board meeting.", "The roadmap has been aligned with the corporate strategy."], ["I would like to clarify the definition of completion used in this report.", "Could you kindly clarify the intended delivery date?"], ["I wish to reiterate that quality remains our foremost priority.", "We reiterate our commitment to the agreed deadline."], ["Performance was benchmarked against the leading providers in the sector.", "The results exceed the industry benchmark by a clear margin."], ["A baseline must be established prior to measuring any improvement.", "Performance has fallen below the baseline since the release."], ["The data indicates a positive trend in defect reduction.", "A concerning trend in customer complaints has been observed."], ["This figure is an outlier attributable to the service interruption in May.", "Outliers have been excluded from the calculation of the mean."], ["The analysis reveals a strong correlation between team size and delivery delays.", "Correlation does not, however, establish causation."], ["It is difficult to quantify the benefits of improved documentation.", "We have sought to quantify the financial impact of the delay."], ["The schedule leaves only a limited margin for error.", "The renegotiated contract has improved our operating margin."], ["Response times fluctuate considerably during periods of peak demand.", "Operating costs have fluctuated throughout the financial year."], ["Productivity plateaued following the first month of implementation.", "Revenue growth has plateaued in the current quarter."], ["The variance against the approved budget stands at under three percent.", "A detailed explanation of the variance is provided in Appendix C."], ["Additional testing will be undertaken to mitigate this risk.", "Cross-training is proposed to mitigate the impact of absences."], ["The investigation traced the outage to a root cause within the configuration.", "A full root cause analysis will be provided within five working days."], ["A temporary workaround is available pending release of the permanent fix.", "This workaround is not recommended as a long-term solution."], ["The proposal involves a trade-off between delivery speed and quality.", "The committee accepted this trade-off in order to meet the regulatory deadline."], ["The reputational fallout from the breach persisted for several months.", "Measures have been taken to manage the fallout from the delay."], ["A common pitfall is the underestimation of integration effort.", "Lessons learned have been applied to avoid previous pitfalls."], ["Additional safeguards have been introduced to prevent accidental data loss.", "Peer review serves as an effective safeguard against defects."], ["All identified vulnerabilities will be remediated by Friday 13 November.", "Remediation of the data quality issues is currently under way."], ["We anticipate some resistance to the proposed organisational change.", "Anticipating higher demand, we increased capacity in advance."], ["Accelerating the release would only exacerbate the existing difficulties.", "Staff shortages have exacerbated the delays across the programme."]];
function one(n) {
  const c = CARDS[n], h = hue(n), col = `hsl(${h} 70% 78%)`;
  const lab = t => `<b class="serif" style="color:${col}">${t}</b>`;
  const bg = IM.length
    ? `<img src="${IM[n % IM.length]}" alt="" draggable="false" class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none">`
    : `<div class="absolute inset-0" style="background:radial-gradient(circle at 50% 25%, hsl(${h} 55% 32%), hsl(${(h+30)%360} 50% 8%) 75%)"></div>`;
  return `<div class="face absolute inset-0 rounded-3xl overflow-hidden shadow-2xl" style="border:1px solid rgba(255,255,255,.12);background:#000">
    ${bg}
    <div class="absolute inset-0 pointer-events-none" style="background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.72) 35%, rgba(0,0,0,.88)), hsl(${h} 55% 25% / .25)"></div>
    <span class="absolute top-4 left-4 serif font-extrabold text-sm px-3 py-1 rounded-full" style="background:rgba(0,0,0,.45);color:hsl(${h} 70% 82%);backdrop-filter:blur(6px);z-index:5">${esc(CFG.noun)} ${n + 1}</span>
    <span class="absolute top-3 right-16 w-11 h-11 rounded-full flex items-center justify-center text-2xl" style="background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:5">${esc(c.emoji)}</span>
    <span class="stamp keep absolute top-20 left-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-amber-300 text-amber-300" style="opacity:0;transform:rotate(-14deg);z-index:6">PREV</span>
    <span class="stamp pass absolute top-20 right-6 serif font-extrabold text-3xl px-3 py-1 rounded-lg border-4 border-emerald-400 text-emerald-400" style="opacity:0;transform:rotate(14deg);z-index:6">NEXT</span>
    <div class="absolute inset-0 overflow-y-auto px-5 pt-16 pb-6 text-[14px] leading-snug flex flex-col gap-3" style="color:#e9dfcf;touch-action:pan-y">

function cardEl(n) {
  const el = document.createElement('article');
  el.className = 'card absolute inset-0';
  el.style.perspective = '1400px';
  el.style.touchAction = 'pan-y';
  el.innerHTML = `${one(n)}
    <button data-fav data-n="${n}" aria-label="Favourite this card" aria-pressed="false" class="absolute top-3 right-3 w-11 h-11 rounded-full flex items-center justify-center text-2xl text-pink-400" style="z-index:20;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);cursor:pointer">♡</button>`;
  return el;
}

function paint() {
  document.getElementById('favn').textContent = favs.size;
  favView.setAttribute('aria-pressed', showFav);
  favView.style.background = showFav ? 'rgba(244,114,182,.25)' : 'transparent';
  favView.style.opacity = (favs.size || showFav) ? 1 : .5;
  stack.querySelectorAll('[data-fav]').forEach(b => {
    const on = favs.has(+b.dataset.n);
    b.textContent = on ? '♥' : '♡';
    b.setAttribute('aria-pressed', on);
  });
}

function render() {
  if (showFav && !favs.size) { showFav = false; save(VK, 'all'); }
  stack.innerHTML = '';
  const behind = cardEl(step(1));
  behind.style.transform = 'scale(.94) translateY(14px)';
  behind.style.opacity = '.7';
  behind.style.pointerEvents = 'none';
  const top = cardEl(i);
  stack.append(behind, top);
  const L = list();
  count.textContent = (showFav ? '♥ ' : '') + `${L.indexOf(i) + 1} / ${L.length}`;
  save(K, String(i));
  paint();
  attach(top);
  busy = false;
}

function flip(el) {
  return; // flip disabled: single-face cards
  const inner = el.querySelector('.inner'), f = !inner.style.transform;
  inner.style.transform = f ? 'rotateY(180deg)' : '';
  el.style.touchAction = f ? 'pan-y' : 'none';
}

let lastTap = 0, lastX = 0, lastY = 0;
function attach(el) {
  let sx = 0, sy = 0, dx = 0, drag = false;
  const prevStamp = el.querySelector('.keep'), nextStamp = el.querySelector('.pass');
  const pose = (x, y) => {
    el.style.transform = `translate(${x}px, ${y}px) rotate(${x / 18}deg)`;
    prevStamp.style.opacity = Math.max(0, Math.min(1, x / 100));
    nextStamp.style.opacity = Math.max(0, Math.min(1, -x / 100));
  };
  el.addEventListener('pointerdown', e => {
    if (busy || e.target.closest('[data-fav]')) return;
    drag = true; dx = 0; sx = e.clientX; sy = e.clientY;
    el.setPointerCapture(e.pointerId); el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - sx; pose(dx, (e.clientY - sy) * .3); });
  const end = e => {
    if (!drag) return; drag = false;
    if (Math.abs(dx) > 90) go(dx < 0 ? 1 : -1);
    else {
      el.style.transition = 'transform .25s'; pose(0, 0);
      if (Math.abs(dx) < 6 && e.type === 'pointerup') {
        const now = Date.now();
        if (now - lastTap < 350 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 30) { flip(el); lastTap = 0; }
        else { lastTap = now; lastX = e.clientX; lastY = e.clientY; }
      }
    }
    dx = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

// d = +1 next card, -1 previous card
function go(d) {
  if (busy) return; busy = true;
  const el = stack.lastElementChild, dir = d > 0 ? -1 : 1;
  el.style.transition = 'transform .3s ease-in, opacity .3s';
  el.style.transform = `translate(${dir * 520}px, 40px) rotate(${dir * 24}deg)`;
  el.style.opacity = '0';
  setTimeout(() => { i = step(d); render(); }, 280);
}

function toggleFav() {
  if (busy) return;
  favs.has(i) ? favs.delete(i) : favs.add(i);
  save(FK, JSON.stringify([...favs]));
  paint();
}

favView.onclick = () => {
  if (busy) return;
  if (!showFav && !favs.size) { say('No favourites yet. Tap the heart on a card to save it.'); return; }
  showFav = !showFav;
  save(VK, showFav ? 'fav' : 'all');
  if (showFav && !favs.has(i)) i = step(1);
  render();
};
stack.addEventListener('click', e => { if (e.target.closest('[data-fav]')) toggleFav(); });
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'f' || e.key === 'F') toggleFav();
  else if ([' ', 'Enter', 'ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); flip(stack.lastElementChild); }
});
render();
</script>
